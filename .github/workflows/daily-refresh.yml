name: Daily data refresh and Pages deployment
on:
  schedule:
    # UTC 00:17 = Asia/Hong_Kong / Asia/Shanghai 08:17.
    - cron: '17 0 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Re-download the complete source snapshot even if unchanged
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '*.js'
      - '*.html'
      - '*.css'
      - 'scripts/**'
      - 'tests/**'
      - 'assets/**'
      - 'asset-overrides.json'
      - 'package.json'
      - '.github/workflows/daily-refresh.yml'
permissions:
  contents: read
concurrency:
  group: pages-publish
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh the latest public snapshot
        env:
          FORCE_REFRESH: ${{ inputs.force || false }}
        run: |
          if [ "$FORCE_REFRESH" = 'true' ]; then
            python3 scripts/sync_data.py --force
          else
            python3 scripts/sync_data.py
          fi
      - name: Validate data, statistics, and failure handling
        run: npm run check
      - name: Commit only the validated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json update.json asset-overrides.json assets history
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh verified snapshot $(date -u +%F)"
            git push origin HEAD:main
          fi
      - name: Package the validated website
        run: python3 scripts/package_site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .site
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # GITHUB_TOKEN commits do not trigger another push workflow: deploy explicitly here.
      - id: deployment
        uses: actions/deploy-pages@v4
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify anonymous access to the exact published dataset
        run: python3 scripts/verify_deployment.py
